<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Serves every unknown address on the site. /u/<username> shows that person's whole Lucent desktop.
  (function () { var p = location.pathname, i = p.indexOf('/u/'); var b = i >= 0 ? p.slice(0, i + 1) : (p.indexOf('/lucent/') === 0 ? '/lucent/' : '/'); document.write('<base href="' + b + '">'); })();
</script>
<title>Lucent</title>
<meta property="og:site_name" content="Lucent">
<meta property="og:title" content="A Lucent desktop">
<meta property="og:description" content="Wallpaper, widgets, dock and profile card: someone's whole Lucent setup.">
<meta name="theme-color" content="#08070f">
<link rel="icon" type="image/png" href="assets/icon-64.png?v=240">
<link rel="stylesheet" href="assets/widgets.css?v=240">
<style>
:root{color-scheme:dark;--acc:#a44dff;--ink:#f6f4ff;--dim:rgba(246,244,255,.62);--line:rgba(255,255,255,.12);--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--sysd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--spring:cubic-bezier(.32,1.3,.45,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#08070f;color:var(--ink);font:15px/1.5 var(--sys);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
/* the desktop */
.desk{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:0;background:#0b0b12 center/cover no-repeat;opacity:0;transform:scale(1.04);transition:opacity 1.2s ease,transform 2.4s cubic-bezier(.2,.8,.2,1)}
.wall.on{opacity:1;transform:none}
video.wall,iframe.wall{width:100%;height:100%;object-fit:cover;border:0;pointer-events:none}
.shade{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 50%,rgba(0,0,0,.18),rgba(0,0,0,.5));pointer-events:none;transition:opacity .5s}
body.peek .shade{opacity:.25}
#wl{position:absolute;inset:0}
/* menu bar */
.menubar{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:13.5px;font-weight:600;background:rgba(14,12,24,.38);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);z-index:5}
.menubar img{width:16px;height:16px;border-radius:4px}
.menubar .who{font-weight:700}
.menubar .dim{font-weight:500;color:var(--dim)}
.menubar .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-weight:500}
.menubar svg{width:22px;height:12px}
/* island */
.island{position:absolute;top:0;left:50%;translate:-50% 0;height:34px;min-width:210px;padding:0 16px;border-radius:0 0 18px 18px;background:#000;display:flex;align-items:center;justify-content:space-between;gap:30px;font-size:12.5px;font-weight:650;z-index:6;box-shadow:0 10px 30px -12px rgba(0,0,0,.8);animation:drop .9s var(--spring) both .3s}
.island.pill{top:8px;border-radius:999px;height:32px}
.island i{width:7px;height:7px;border-radius:50%;background:#34c759;box-shadow:0 0 10px #34c759}
.island .eq{display:flex;gap:2px;align-items:flex-end;height:12px}
.island .eq b{width:3px;border-radius:2px;background:var(--acc);height:40%;animation:eq 1s ease-in-out infinite alternate}
.island .eq b:nth-child(2){animation-delay:-.3s}.island .eq b:nth-child(3){animation-delay:-.6s}
@keyframes eq{to{height:100%}}
@keyframes drop{from{translate:-50% -50px}}
/* dock */
.dock{position:absolute;left:50%;bottom:10px;translate:-50% 0;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-radius:22px;z-index:5;animation:rise .9s var(--spring) both .45s}
.dock.glass{background:rgba(28,26,40,.42);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 18px 40px -16px rgba(0,0,0,.55)}
.dock.solid{background:#141418;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dock.neon{background:rgba(10,10,16,.65);box-shadow:0 0 0 1.5px var(--acc),0 0 26px -2px var(--acc)}
.dock.clear{background:transparent}
.dock.left,.dock.right{top:50%;bottom:auto;translate:0 -50%;flex-direction:column}
.dock.left{left:10px}.dock.right{left:auto;right:10px}
.dock .t{width:var(--ds,48px);height:var(--ds,48px);border-radius:24%;flex:none;display:grid;place-items:center;transition:transform .25s var(--spring);position:relative}
.dock .t:hover{transform:translateY(-10px) scale(1.25)}
.dock .t img{width:100%;height:100%;object-fit:contain}
.dock .ph{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));font-weight:800;font-size:calc(var(--ds,48px)*.42)}
.dock .w{background:linear-gradient(170deg,#26262e,#101014);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-weight:750;font-size:calc(var(--ds,48px)*.28);line-height:1.05;text-align:center}
.dock .w small{display:block;font-size:.55em;opacity:.6;letter-spacing:.04em}
.dock .w.date{background:#f6f6f8;color:#111;grid-template-rows:auto 1fr;place-items:stretch;overflow:hidden}
.dock .w.date em{font-style:normal;background:#ff3b30;color:#fff;font-size:.5em;padding:3px 0 2px}
.dock .w.date strong{display:grid;place-items:center;font-size:1.4em}
.dock .sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.2)}
.dock.left .sep,.dock.right .sep{width:auto;height:1px;margin:2px 6px}
@keyframes rise{from{opacity:0;translate:-50% 40px}}
/* card */
.card{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(430px,calc(100vw - 32px));border-radius:30px;text-align:center;padding:0 26px 24px;background:rgba(14,12,22,var(--co,.5));-webkit-backdrop-filter:blur(var(--cb,22px)) saturate(1.5);backdrop-filter:blur(var(--cb,22px)) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 40px 90px -30px #000,0 0 calc(60px * var(--glow,.5)) -10px var(--acc);z-index:7;animation:pop .8s var(--spring) both .55s;transition:opacity .4s,translate .5s var(--spring)}
.card.hide{opacity:0;translate:-50% -44%;pointer-events:none}
@keyframes pop{from{opacity:0;scale:.92}}
.banner{height:118px;margin:0 -26px;border-radius:30px 30px 0 0;background:linear-gradient(120deg,var(--acc),color-mix(in srgb,var(--acc) 40%,#ff5fb8)) center/cover}
.av{position:relative;width:104px;height:104px;margin:-54px auto 0;border-radius:50%;border:5px solid rgba(14,12,22,.95);background:#232330 center/cover;display:grid;place-items:center;font:800 38px/1 var(--sysd)}
.av::before{content:'';position:absolute;inset:-9px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,var(--acc),#ff5fb8,#5ef0ff,var(--acc));-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ring 6s linear infinite}
@keyframes ring{to{rotate:360deg}}
.name{font:800 28px/1.1 var(--sysd);letter-spacing:-.025em;margin:12px 0 0}
.name span{position:relative;display:inline-block}
.name.glow span{text-shadow:0 0 18px var(--acc),0 0 4px var(--acc)}
.name.rainbow span{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff95,#5ef0ff,#b36bff,#ff6b6b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
.name.sparkle span{background:linear-gradient(100deg,#fff 40%,var(--acc) 50%,#fff 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 2.6s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.user{color:var(--dim);font-size:14.5px;margin-top:2px}
.badges{display:flex;justify-content:center;gap:6px;margin:10px 0 0;font-size:15px}
.badges span{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.bio{margin:12px 0 0;color:#ecebf4;white-space:pre-line;min-height:1.5em}
.loc{margin-top:6px;color:var(--dim);font-size:13px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chips a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);text-decoration:none;font-size:13px;font-weight:650;transition:background .2s,transform .25s var(--spring)}
.chips a:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.chips a:focus-visible,.btn:focus-visible{outline:3px solid #ff8ab4;outline-offset:2px}
.wchip{margin:16px auto 0;display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:6px 13px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:12.5px}
.wchip i{width:24px;height:24px;border-radius:50%;background:#333 center/cover;flex:none}
.wchip span{color:var(--dim)}
.wchip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.meta{display:flex;justify-content:center;gap:14px;margin-top:12px;font-size:12px;color:var(--dim)}
/* top buttons */
.top{position:fixed;top:40px;right:14px;display:flex;gap:8px;z-index:9}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:0;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;background:rgba(0,0,0,.38);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.main{background:#f6f4ff;color:#14111f;box-shadow:none}
/* messages */
.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:12;background:radial-gradient(60% 50% at 30% 30%,rgba(164,77,255,.2),transparent 70%),radial-gradient(60% 60% at 75% 70%,rgba(255,94,126,.16),transparent 70%),#0b0916}
.msg h1{font:750 34px/1.1 var(--sysd);letter-spacing:-.03em;margin:18px 0 8px}
.msg p{color:var(--dim);max-width:440px;margin:0 auto 22px}
.msg img{width:84px;height:84px;margin:0 auto}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:13;background:#08070f;transition:opacity .5s}
.loading.done{opacity:0;pointer-events:none}
.loading i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#a44dff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:700px){.dock,#wl,.menubar .dim,.island{display:none}.top{top:40px}.card{top:54%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading"><i></i></div>
<div class="desk" id="desk" hidden>
  <div class="wall" id="wall"></div>
  <div class="shade"></div>
  <div id="wl"></div>
  <div class="menubar" id="menubar"><img src="assets/icon-64.png?v=240" alt=""><span class="who" id="mbWho">Lucent</span><span class="dim">Wallpaper</span><span class="dim">Widgets</span><span class="dim">Dock</span><span class="right"><svg viewBox="0 0 26 13" fill="none"><rect x=".7" y=".7" width="21.6" height="11.6" rx="3.3" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="8" rx="1.8" fill="currentColor"/><path d="M24 4.5v4" stroke="currentColor" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/></svg><span id="mbDate"></span><span id="mbTime"></span></span></div>
  <div class="island" id="island"><span id="isL"></span><i></i></div>
  <div class="dock glass" id="dock" hidden></div>
  <div class="card" id="card">
    <div class="banner" id="banner"></div>
    <div class="av" id="av"></div>
    <div class="name" id="name"><span></span></div>
    <div class="user" id="uname"></div>
    <div class="badges" id="badges"></div>
    <p class="bio" id="bio"></p>
    <div class="loc" id="loc" hidden></div>
    <div class="chips" id="links"></div>
    <div id="wchip"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<div class="top" id="top" hidden><button class="btn" id="peek" type="button">Hide card</button><a class="btn main" href="./#download">Get Lucent</a></div>
<div class="msg" id="msg" hidden></div>
<script src="assets/widgets.js?v=240"></script>
<script src="assets/accessories.js?v=240"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//i.test(String(u || '')) ? String(u) : '');
  const done = () => $('#loading').classList.add('done');
  const show = (html) => { $('#msg').innerHTML = html; $('#msg').hidden = false; done(); };
  const m = location.pathname.match(/\/u\/([A-Za-z0-9_.]{1,18})\/?$/);
  if (!m) { document.title = 'Page not found · Lucent'; return show(`<div><img src="assets/icon-256.png?v=240" alt=""><h1>This page doesn’t exist</h1><p>The link might be old, or there’s a typo in it.</p><a class="btn main" href="./">Go to Lucent</a></div>`); }
  const name = m[1].toLowerCase();
  document.title = `@${name} on Lucent`;

  let cfg = null;
  for (const u of ['lucent.json', 'https://raw.githubusercontent.com/caulculaslegend-dev/lucent/main/lucent.json']) {
    try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) { cfg = await r.json(); break; } } catch (e) { /* try next */ }
  }
  if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) return show(`<div><img src="assets/icon-256.png?v=240" alt=""><h1>@${esc(name)}</h1><p>Profiles aren’t switched on yet. Check back soon.</p><a class="btn main" href="./">Get Lucent</a></div>`);
  const H = { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${cfg.supabaseAnonKey}` };
  const api = (path, init) => fetch(`${cfg.supabaseUrl}/rest/v1/${path}`, { ...init, headers: { ...H, ...(init && init.headers) } });

  let prof = null; let setup = null;
  try {
    const r = await api(`profiles?username=eq.${encodeURIComponent(name)}&select=id,username,display_name,bio,avatar_url,banner_url,accent,style,created_at`);
    prof = (await r.json())[0] || null;
    if (prof) { const r2 = await api(`setups?user_id=eq.${prof.id}&select=data,views,updated_at`); setup = (await r2.json())[0] || null; }
  } catch (e) { return show(`<div><img src="assets/icon-256.png?v=240" alt=""><h1>Couldn’t load @${esc(name)}</h1><p>Check your connection and try again.</p><a class="btn main" href="">Try again</a></div>`); }
  if (!prof) return show(`<div><img src="assets/icon-256.png?v=240" alt=""><h1>@${esc(name)} is still free</h1><p>Nobody has this username yet. Get Lucent and it can be yours, along with a page like this for your setup.</p><a class="btn main" href="./#download">Get Lucent</a></div>`);

  const d = (setup && setup.data) || {};
  const st = prof.style || {};
  const acc = /^#[0-9a-f]{6}$/i.test(prof.accent || '') ? prof.accent : '#a44dff';
  document.documentElement.style.setProperty('--acc', acc);
  const card = $('#card');
  card.style.setProperty('--glow', Math.max(0, Math.min(1, st.glow == null ? 0.5 : +st.glow)));
  card.style.setProperty('--co', Math.max(0.2, Math.min(0.95, st.cardOpacity == null ? 0.5 : +st.cardOpacity)));
  card.style.setProperty('--cb', `${Math.max(0, Math.min(40, st.cardBlur == null ? 22 : +st.cardBlur))}px`);

  // ---- wallpaper: their picture, their live video, or their YouTube wallpaper
  const w = d.wallpaper || null;
  const wall = $('#wall');
  if (w && w.type === 'video' && safeUrl(w.url)) {
    const v = document.createElement('video'); v.className = 'wall'; v.src = w.url; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', '');
    v.oncanplay = () => { v.classList.add('on'); v.play().catch(() => {}); }; wall.replaceWith(v); v.id = 'wall';
  } else if (w && w.type === 'youtube' && /^[\w-]{11}$/.test(String(w.videoId || ''))) {
    const f = document.createElement('iframe'); f.className = 'wall on'; f.allow = 'autoplay; encrypted-media'; f.title = 'Wallpaper';
    f.src = `player.html#${new URLSearchParams({ v: w.videoId, mute: '1', fit: 'cover' })}`; wall.replaceWith(f); f.id = 'wall';
  } else if (w && safeUrl(w.url)) {
    const im = new Image(); im.onload = () => wall.classList.add('on'); im.src = w.url; wall.style.backgroundImage = `url("${w.url}")`;
  } else { wall.style.background = 'radial-gradient(70% 60% at 30% 30%, rgba(164,77,255,.3), transparent 70%), radial-gradient(70% 70% at 70% 70%, rgba(255,94,126,.25), transparent 70%), #0b0916'; wall.classList.add('on'); }

  // ---- widgets, where they sit on their screen
  try {
    if (Array.isArray(d.widgets) && d.widgets.length && window.LucentWidgets) {
      window.LucentWidgets.mount($('#wl'), { widgets: d.widgets.filter((x) => x && x.type !== 'profile'), screenW: (d.screen && d.screen.w) || 1440, screenH: (d.screen && d.screen.h) || 900, editable: false, interactive: false, accent: (d.theme && d.theme.accent) || acc, ctx: {} });
    }
  } catch (e) { console.warn('widgets', e); }

  // ---- menu bar + island
  $('#mbWho').textContent = `@${prof.username}`;
  const lk = (d.island && d.island.look) || {};
  if (lk.shape === 'pill') $('#island').classList.add('pill');
  if (d.island && d.island.notch && d.island.notch.w) $('#island').style.minWidth = `${Math.min(420, d.island.notch.w + 160)}px`;

  // ---- dock: their apps and widgets, in their dock style
  const ds = d.dockStyle || {};
  const dock = $('#dock');
  if (Array.isArray(d.dock) && d.dock.length && ds.enabled !== false) {
    dock.className = `dock ${['glass', 'solid', 'neon', 'clear'].includes(ds.style) ? ds.style : 'glass'}${ds.position === 'left' ? ' left' : ds.position === 'right' ? ' right' : ''}`;
    dock.style.setProperty('--ds', `${Math.max(36, Math.min(64, +ds.size || 50))}px`);
    const now = new Date();
    dock.innerHTML = d.dock.slice(0, 18).map((x) => {
      if (x.kind === 'widget') {
        if (x.w === 'sep') return '<span class="sep"></span>';
        if (x.w === 'spacer') return '<span style="width:20px"></span>';
        if (x.w === 'clock') return `<span class="t w" data-clock>${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '')}</span>`;
        if (x.w === 'date') return `<span class="t w date"><em>${esc(now.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase())}</em><strong>${now.getDate()}</strong></span>`;
        return `<span class="t w" title="${esc(x.name)}">${esc(String(x.name || '').slice(0, 1).toUpperCase())}</span>`;
      }
      return /^data:image\/png;base64,/.test(x.icon || '') ? `<span class="t" title="${esc(x.name)}"><img src="${x.icon}" alt="${esc(x.name)}"></span>` : `<span class="t ph" title="${esc(x.name)}">${esc(String(x.name || '?').slice(0, 1).toUpperCase())}</span>`;
    }).join('');
    dock.hidden = false;
  }

  // ---- the card
  if (safeUrl(prof.banner_url)) $('#banner').style.backgroundImage = `url("${prof.banner_url}")`;
  if (safeUrl(prof.avatar_url)) $('#av').style.backgroundImage = `url("${prof.avatar_url}")`; else $('#av').textContent = String(prof.display_name || prof.username || 'L').slice(0, 1).toUpperCase();
  const nm = $('#name'); nm.querySelector('span').textContent = prof.display_name || prof.username;
  if (['glow', 'rainbow', 'sparkle'].includes(st.nameEffect)) nm.classList.add(st.nameEffect);
  $('#uname').textContent = `@${prof.username}`;
  const BADGES = { verified: '✔️', developer: '💻', gamer: '🎮', artist: '🎨', music: '🎧', early: '🌟', premium: '💎', owner: '👑', bughunter: '🐛', og: '🔥', creator: '📹', night: '🌙' };
  $('#badges').innerHTML = (Array.isArray(st.badges) ? st.badges : []).filter((b) => BADGES[b]).map((b) => `<span>${BADGES[b]}</span>`).join('');
  if (st.location) { $('#loc').textContent = `📍 ${st.location}`; $('#loc').hidden = false; }
  const LABEL = { discord: 'Discord', youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', x: 'X', github: 'GitHub', twitch: 'Twitch', spotify: 'Spotify', roblox: 'Roblox', steam: 'Steam', soundcloud: 'SoundCloud', kofi: 'Ko-fi', website: 'Website', email: 'Email' };
  $('#links').innerHTML = (Array.isArray(st.links) ? st.links : []).filter((l) => l && l.url && LABEL[l.type]).slice(0, 10).map((l) => {
    const href = l.type === 'email' ? (/^[^@\s]+@[^@\s]+$/.test(l.url) ? `mailto:${l.url}` : '') : (/^https?:\/\//i.test(l.url) ? l.url : (/^[\w.-]+\.[a-z]{2,}(\/\S*)?$/i.test(l.url) ? `https://${l.url}` : ''));
    return href ? `<a href="${esc(href)}" target="_blank" rel="noopener nofollow">${esc(LABEL[l.type])}</a>` : '';
  }).join('');
  const bio = String(prof.bio || '');
  if (st.bioTypewriter && !matchMedia('(prefers-reduced-motion: reduce)').matches) { let i = 0; const t = setInterval(() => { $('#bio').textContent = bio.slice(0, ++i); if (i >= bio.length) clearInterval(t); }, 38); } else $('#bio').textContent = bio;
  if (w) $('#wchip').innerHTML = `<div class="wchip"><i style="${w.type === 'youtube' ? `background-image:url('https://i.ytimg.com/vi/${esc(w.videoId)}/default.jpg')` : w.type === 'image' && safeUrl(w.url) ? `background-image:url('${esc(w.url)}')` : 'background:var(--acc)'}"></i><span>Wallpaper</span><b>${esc(w.title || (w.type === 'video' ? 'Live wallpaper' : w.type === 'youtube' ? 'YouTube' : 'Picture'))}</b></div>`;
  const meta = [];
  if (prof.created_at) meta.push(`Joined ${new Date(prof.created_at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}`);
  if (setup && setup.views != null) meta.push(`${(setup.views + 1).toLocaleString()} views`);
  $('#meta').innerHTML = meta.map((x) => `<span>${esc(x)}</span>`).join('');

  // ---- accessories: only the ones this person owns
  const wantAcc = (Array.isArray(st.accessories) ? st.accessories : []).filter((x) => typeof x === 'string').slice(0, 6);
  if (wantAcc.length && window.LucentAccessories) {
    let owned = ['sparkle'];
    try { const r = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/owned_items`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: prof.id }) }); if (r.ok) owned = (await r.json()).map((x) => (typeof x === 'string' ? x : x.owned_items)); } catch (e) { /* free ones only */ }
    const wear = wantAcc.filter((x) => owned.includes(x));
    setTimeout(() => window.LucentAccessories.apply(card, $('#av'), wear, { seed: prof.username.length, nameEl: nm.querySelector('span') }), 900);
  }

  // ---- live bits
  const tick = () => {
    const n = new Date();
    $('#mbTime').textContent = n.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('#mbDate').textContent = n.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    $('#isL').textContent = n.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.querySelectorAll('[data-clock]').forEach((x) => { x.textContent = n.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, ''); });
  };
  tick(); setInterval(tick, 15000);
  $('#peek').onclick = () => { card.classList.toggle('hide'); document.body.classList.toggle('peek', card.classList.contains('hide')); $('#peek').textContent = card.classList.contains('hide') ? 'Show card' : 'Hide card'; };
  fetch(`${cfg.supabaseUrl}/rest/v1/rpc/bump_view`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }).catch(() => {});
  $('#desk').hidden = false; $('#top').hidden = false; done();
})();
</script>
</body>
</html>
