<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // Serves every unknown address on the site. /u/<username> shows that person's Lucent setup.
  (function () { var p = location.pathname, i = p.indexOf('/u/'); var b = i >= 0 ? p.slice(0, i + 1) : (p.indexOf('/lucent/') === 0 ? '/lucent/' : '/'); document.write('<base href="' + b + '">'); })();
</script>
<title>Lucent</title>
<link rel="icon" type="image/png" href="assets/icon-64.png">
<link rel="stylesheet" href="assets/widgets.css">
<style>
:root{color-scheme:dark;--acc:#5ef0ff;--acc2:#8b6bff;--acc3:#ff5fb8;--ink:#f4f4f6;--dim:#a3a3ad;--spring:cubic-bezier(.32,1.35,.45,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#05050a;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
.desk{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:-2%;background:#0b0b10 center/cover no-repeat;opacity:0;transform:scale(1.06);transition:opacity 1.2s ease,transform 2.4s cubic-bezier(.2,.8,.2,1)}
.wall.on{opacity:1;transform:scale(1)}
video.wall{width:104%;height:104%;object-fit:cover}
.shade{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,transparent 40%,rgba(0,0,0,.55))}
#wl{position:absolute;inset:0}
.island{position:absolute;top:10px;left:50%;translate:-50% 0;height:34px;min-width:150px;padding:0 16px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:650;box-shadow:0 10px 30px -10px rgba(0,0,0,.8);z-index:5;animation:drop .9s var(--spring) both .3s}
.island i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
@keyframes drop{from{translate:-50% -60px}}
.dock{position:absolute;left:50%;bottom:14px;translate:-50% 0;display:flex;gap:10px;padding:9px 12px;border-radius:24px;background:rgba(30,30,40,.35);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 20px 50px -20px rgba(0,0,0,.8);z-index:5;animation:rise .9s var(--spring) both .5s}
.dock img,.dock .ph{width:46px;height:46px;border-radius:12px;transition:transform .3s var(--spring)}
.dock .ph{display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:700}
.dock img:hover,.dock .ph:hover{transform:translateY(-8px) scale(1.18)}
@keyframes rise{from{opacity:0;translate:-50% 40px}}
.card{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(420px,calc(100vw - 32px));border-radius:28px;overflow:hidden;background:rgba(14,14,22,var(--co,.45));-webkit-backdrop-filter:blur(var(--cb,22px)) saturate(1.5);backdrop-filter:blur(var(--cb,22px)) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 40px 100px -30px rgba(0,0,0,.9),0 0 calc(var(--glow,.5) * 90px) calc(var(--glow,.5) * -10px) var(--acc);text-align:center;z-index:6;animation:pop .9s var(--spring) both .2s;transition:opacity .4s,translate .4s}
.card.hide{opacity:0;translate:-50% -46%;pointer-events:none}
@keyframes pop{from{opacity:0;scale:.92}}
.banner{height:120px;background:linear-gradient(120deg,var(--acc),var(--acc2),var(--acc3)) center/cover}
.av{width:96px;height:96px;margin:-52px auto 0;border-radius:50%;border:4px solid rgba(14,14,22,.9);background:#222 center/cover;box-shadow:0 0 0 2px var(--acc);position:relative}
.body{padding:12px 24px 24px}
.name{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.name.glow{text-shadow:0 0 18px var(--acc),0 0 4px var(--acc)}
.name.rainbow{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff95,#5ef0ff,#b36bff,#ff6b6b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
.name.sparkle{background:linear-gradient(100deg,#fff 40%,var(--acc) 50%,#fff 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 2.6s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.user{color:var(--dim);font-size:14px}
.badges{display:flex;justify-content:center;gap:6px;margin:8px 0 2px;font-size:16px}
.bio{margin:10px 0 0;color:#e6e6ec;white-space:pre-line;min-height:1.5em}
.loc{margin-top:6px;color:var(--dim);font-size:13px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.links a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);text-decoration:none;font-size:13px;font-weight:600;transition:background .2s,transform .2s}
.links a:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.top{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:8;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-weight:700;text-decoration:none;font-size:14px}
.brand img{width:26px;height:26px;border-radius:7px}
.acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:0;border-radius:12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;background:rgba(0,0,0,.35);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.main{background:#f2f2f4;color:#111;box-shadow:none}
.views{position:fixed;left:16px;bottom:16px;z-index:8;font-size:12px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);padding:5px 10px;border-radius:10px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:9;background:radial-gradient(60% 50% at 30% 30%,rgba(94,240,255,.16),transparent 70%),radial-gradient(60% 60% at 75% 70%,rgba(255,95,184,.14),transparent 70%),#05050a}
.msg h1{font-size:34px;letter-spacing:-.03em;margin:16px 0 6px}
.msg p{color:var(--dim);max-width:440px;margin:0 auto 22px}
.msg img{width:84px;height:84px;filter:drop-shadow(0 16px 30px rgba(139,107,255,.45))}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:#05050a;transition:opacity .5s}
.loading.done{opacity:0;pointer-events:none}
.loading i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.dock{display:none}#wl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading"><i></i></div>
<div class="desk" id="desk" hidden>
  <div class="wall" id="wall"></div>
  <div class="shade"></div>
  <div id="wl"></div>
  <div class="island" id="island"><i></i><span id="clock"></span></div>
  <div class="dock" id="dock" hidden></div>
  <div class="card" id="card">
    <div class="banner" id="banner"></div>
    <div class="av" id="av"></div>
    <div class="body">
      <div class="name" id="name"></div>
      <div class="user" id="uname"></div>
      <div class="badges" id="badges"></div>
      <p class="bio" id="bio"></p>
      <div class="loc" id="loc" hidden></div>
      <div class="links" id="links"></div>
    </div>
  </div>
</div>
<div class="top" id="top" hidden>
  <a class="brand" href="./"><img src="assets/icon-64.png" alt=""><span>Lucent</span></a>
  <div class="acts"><button class="btn" id="peek" type="button">Hide card</button><a class="btn main" href="./#download">Get Lucent</a></div>
</div>
<div class="views" id="views" hidden></div>
<div class="msg" id="msg" hidden></div>
<script src="assets/widgets.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//i.test(String(u || '')) ? String(u) : '');
  const done = () => $('#loading').classList.add('done');
  const show = (html) => { $('#msg').innerHTML = html; $('#msg').hidden = false; done(); };
  const m = location.pathname.match(/\/u\/([A-Za-z0-9_.]{3,20})\/?$/);
  if (!m) { document.title = 'Page not found · Lucent'; return show(`<div><img src="assets/icon-256.png" alt=""><h1>This page doesn’t exist</h1><p>The link might be old, or there’s a typo in it.</p><a class="btn main" href="./">Go to Lucent</a></div>`); }
  const name = m[1].toLowerCase();
  document.title = `@${name} · Lucent`;

  let cfg = null;
  for (const u of ['lucent.json', 'https://raw.githubusercontent.com/caulculaslegend-dev/lucent/main/lucent.json']) {
    try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) { cfg = await r.json(); break; } } catch (e) { /* try next */ }
  }
  if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) return show(`<div><img src="assets/icon-256.png" alt=""><h1>@${esc(name)}</h1><p>Profiles aren’t switched on yet. Check back soon.</p><a class="btn main" href="./">Get Lucent</a></div>`);
  const H = { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${cfg.supabaseAnonKey}` };
  const api = (path, init) => fetch(`${cfg.supabaseUrl}/rest/v1/${path}`, { ...init, headers: { ...H, ...(init && init.headers) } });

  let prof = null; let setup = null;
  try {
    const r = await api(`profiles?username=eq.${encodeURIComponent(name)}&select=id,username,display_name,bio,avatar_url,banner_url,accent,style`);
    prof = (await r.json())[0] || null;
    if (prof) { const r2 = await api(`setups?user_id=eq.${prof.id}&select=data,views,updated_at`); setup = (await r2.json())[0] || null; }
  } catch (e) { return show(`<div><img src="assets/icon-256.png" alt=""><h1>Couldn’t load @${esc(name)}</h1><p>Check your connection and try again.</p><a class="btn main" href="">Try again</a></div>`); }
  if (!prof) return show(`<div><img src="assets/icon-256.png" alt=""><h1>@${esc(name)} is still free</h1><p>Nobody has this username yet. Get Lucent and it can be yours, along with a page like this for your setup.</p><a class="btn main" href="./#download">Get Lucent</a></div>`);

  const d = (setup && setup.data) || {};
  const st = prof.style || {};
  const acc = /^#[0-9a-f]{6}$/i.test(prof.accent || '') ? prof.accent : '#5ef0ff';
  document.documentElement.style.setProperty('--acc', acc);
  const card = $('#card');
  card.style.setProperty('--glow', Math.max(0, Math.min(1, st.glow == null ? 0.5 : +st.glow)));
  card.style.setProperty('--co', Math.max(0, Math.min(0.95, st.cardOpacity == null ? 0.45 : +st.cardOpacity)));
  card.style.setProperty('--cb', `${Math.max(0, Math.min(40, st.cardBlur == null ? 22 : +st.cardBlur))}px`);

  // wallpaper
  const w = d.wallpaper && safeUrl(d.wallpaper.url) ? d.wallpaper : null;
  if (w && w.type === 'video') {
    const v = document.createElement('video'); v.className = 'wall'; v.src = w.url; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
    v.oncanplay = () => v.classList.add('on'); $('#wall').replaceWith(v); v.id = 'wall';
  } else if (w) {
    const im = new Image(); im.onload = () => $('#wall').classList.add('on'); im.src = w.url; $('#wall').style.backgroundImage = `url("${w.url}")`;
  } else { $('#wall').style.background = 'radial-gradient(70% 60% at 30% 30%, rgba(94,240,255,.25), transparent 70%), radial-gradient(70% 70% at 70% 70%, rgba(255,95,184,.22), transparent 70%), #07070d'; $('#wall').classList.add('on'); }

  // widgets, exactly where they sit on their screen
  try {
    if (Array.isArray(d.widgets) && d.widgets.length && window.LucentWidgets) {
      window.LucentWidgets.mount($('#wl'), { widgets: d.widgets.filter((x) => x && x.type !== 'profile'), screenW: (d.screen && d.screen.w) || 1440, screenH: (d.screen && d.screen.h) || 900, editable: false, interactive: false, accent: (d.theme && d.theme.accent) || acc, ctx: {} });
    }
  } catch (e) { console.warn('widgets', e); }

  // dock
  if (Array.isArray(d.dock) && d.dock.length) {
    $('#dock').innerHTML = d.dock.slice(0, 14).map((x) => (/^data:image\/png;base64,/.test(x.icon || '') ? `<img src="${x.icon}" alt="${esc(x.name)}" title="${esc(x.name)}">` : `<span class="ph" title="${esc(x.name)}">${esc(String(x.name || '?').slice(0, 1).toUpperCase())}</span>`)).join('');
    $('#dock').hidden = false;
  }

  // card
  if (safeUrl(prof.banner_url)) $('#banner').style.backgroundImage = `url("${prof.banner_url}")`;
  if (safeUrl(prof.avatar_url)) $('#av').style.backgroundImage = `url("${prof.avatar_url}")`;
  const nm = $('#name'); nm.textContent = prof.display_name || prof.username; if (['glow', 'rainbow', 'sparkle'].includes(st.nameEffect)) nm.classList.add(st.nameEffect);
  $('#uname').textContent = `@${prof.username}`;
  const BADGES = { verified: '✔️', developer: '💻', gamer: '🎮', artist: '🎨', music: '🎧', early: '🌟', premium: '💎', owner: '👑', bughunter: '🐛', og: '🔥', creator: '📹', night: '🌙' };
  $('#badges').innerHTML = (Array.isArray(st.badges) ? st.badges : []).filter((b) => BADGES[b]).map((b) => `<span>${BADGES[b]}</span>`).join('');
  if (st.location) { $('#loc').textContent = `📍 ${st.location}`; $('#loc').hidden = false; }
  const LABEL = { discord: 'Discord', youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', x: 'X', github: 'GitHub', twitch: 'Twitch', spotify: 'Spotify', roblox: 'Roblox', steam: 'Steam', soundcloud: 'SoundCloud', kofi: 'Ko-fi', website: 'Website', email: 'Email' };
  $('#links').innerHTML = (Array.isArray(st.links) ? st.links : []).filter((l) => l && l.url && LABEL[l.type]).slice(0, 10).map((l) => {
    const href = l.type === 'email' ? (/^[^@\s]+@[^@\s]+$/.test(l.url) ? `mailto:${l.url}` : '') : (/^https?:\/\//i.test(l.url) ? l.url : (/^[\w.-]+\.[a-z]{2,}(\/\S*)?$/i.test(l.url) ? `https://${l.url}` : ''));
    return href ? `<a href="${esc(href)}" target="_blank" rel="noopener nofollow">${esc(LABEL[l.type])}</a>` : '';
  }).join('');
  const bio = String(prof.bio || '');
  if (st.bioTypewriter && !matchMedia('(prefers-reduced-motion: reduce)').matches) { let i = 0; const t = setInterval(() => { $('#bio').textContent = bio.slice(0, ++i); if (i >= bio.length) clearInterval(t); }, 38); } else $('#bio').textContent = bio;

  // island clock
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  tick(); setInterval(tick, 15000);

  $('#peek').onclick = () => { card.classList.toggle('hide'); $('#peek').textContent = card.classList.contains('hide') ? 'Show card' : 'Hide card'; };
  if (setup && setup.views != null) { $('#views').textContent = `${(setup.views + 1).toLocaleString()} views`; $('#views').hidden = false; }
  fetch(`${cfg.supabaseUrl}/rest/v1/rpc/bump_view`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }).catch(() => {});
  document.querySelector('meta[name=viewport]');
  $('#desk').hidden = false; $('#top').hidden = false; done();
})();
</script>
</body>
</html>
