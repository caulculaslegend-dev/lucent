<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lucent Shop</title>
<link rel="icon" type="image/png" href="assets/icon-64.png?v=240">
<style>
:root{color-scheme:dark;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
html,body{margin:0;height:100%;background:radial-gradient(60% 50% at 30% 25%,rgba(164,77,255,.22),transparent 70%),radial-gradient(60% 60% at 75% 75%,rgba(255,94,126,.16),transparent 70%),#0e0b1c;color:#f6f4ff;font:17px/1.55 var(--sys);-webkit-font-smoothing:antialiased}
main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
img{width:84px;height:84px}
h1{margin:20px 0 8px;font-size:34px;letter-spacing:-.03em;line-height:1.1}
p{color:rgba(246,244,255,.7);max-width:430px;margin:0 auto 24px}
a{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:14px;background:#f6f4ff;color:#14111f;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #ff8ab4;outline-offset:3px}
</style>
</head>
<body>
<main><div>
  <img src="assets/icon-256.png?v=240" alt="">
  <h1 id="t">Thanks, it’s yours</h1>
  <p id="p">Go back to Lucent. Your new accessory shows up in the Shop within a few seconds, ready to wear.</p>
  <a href="./">Back to Lucent’s website</a>
</div></main>
<script>
  if (new URLSearchParams(location.search).get('cancelled')) {
    document.getElementById('t').textContent = 'No worries';
    document.getElementById('p').textContent = 'You weren’t charged. You can keep trying things on in Lucent’s Shop and buy whenever you like.';
  }
</script>
</body>
</html>
